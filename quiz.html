<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Multiplication Quiz &middot; Mathly</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<header class="site-header">
  <div class="wrap">
    <a class="back" href="index.html">⬅ Back to games</a>
    <h1 class="brand"><span class="brand-emoji" aria-hidden="true">⏱️</span> Multiplication Quiz</h1>
    <p class="tagline">Beat the clock and collect your stars!</p>
  </div>
</header>

<main class="wrap">
  <section class="panel" aria-label="Make a quiz">
    <h2 class="panel-title">1. Make your quiz 🎲</h2>
    <form id="quizSetup" class="controls">
      <label class="field">
        <span>Numbers from</span>
        <input type="number" id="qFrom" min="1" max="30" value="2" required>
      </label>
      <label class="field">
        <span>Numbers to</span>
        <input type="number" id="qTo" min="1" max="30" value="12" required>
      </label>
      <label class="field">
        <span>Numbers per sum</span>
        <select id="qFactors">
          <option value="2" selected>2 (a × b)</option>
          <option value="3">3 (a × b × c)</option>
          <option value="4">4 (a × b × c × d)</option>
          <option value="mix">Mix them up! 🎪</option>
        </select>
      </label>
      <label class="field">
        <span>How many sums</span>
        <input type="number" id="qCount" min="1" max="50" value="10" required>
      </label>
      <label class="field">
        <span>Timer (minutes)</span>
        <input type="number" id="qMinutes" min="0" max="60" value="3" required>
      </label>
      <label class="field">
        <span>+ seconds</span>
        <input type="number" id="qSeconds" min="0" max="59" value="0" required>
      </label>
      <button type="submit" class="btn btn-primary">🎉 Create new quiz</button>
    </form>
    <p class="hint" id="quizHint">Set the timer to 0 minutes and 0 seconds for no clock at all.</p>
  </section>

  <section class="panel" id="quizPanel" hidden>
    <div class="quiz-top">
      <h2 class="panel-title" id="quizTitle">2. Answer the sums ✏️</h2>
      <div class="timer" id="timer" hidden>
        <span class="timer-emoji" aria-hidden="true">⏱️</span>
        <span class="timer-value" id="timerValue">00:00</span>
      </div>
    </div>

    <div id="quizResult" class="result" hidden>
      <span class="result-emoji" id="quizResultEmoji" aria-hidden="true"></span>
      <span class="result-text">
        <strong id="quizResultHead"></strong>
        <span id="quizResultSub"></span>
        <span class="stars" id="quizResultStars" aria-hidden="true"></span>
      </span>
    </div>

    <ol class="quiz-list" id="quizList"></ol>

    <div class="quiz-actions">
      <button type="button" class="btn btn-primary" id="finishBtn">✅ Finish &amp; see my score</button>
      <button type="button" class="btn btn-ghost" id="newQuizBtn">🎲 New quiz</button>
    </div>
  </section>

  <section class="panel" id="scorePanel" hidden>
    <h2 class="panel-title">🏆 My scores</h2>
    <ul class="scoreboard" id="scoreboard"></ul>
    <button type="button" class="btn btn-ghost" id="clearScores">🧹 Clear my scores</button>
  </section>
</main>

<footer class="wrap site-footer">
  <p><a href="index.html">⬅ Back to games</a></p>
</footer>

<script src="assets/quiz.js"></script>
</body>
</html>
