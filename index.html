<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Math Playground</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<header class="site-header">
  <div class="wrap">
    <h1 class="brand"><span class="brand-emoji" aria-hidden="true">🎈</span> Math Playground</h1>
    <p class="tagline">Fun practice, one number at a time!</p>
  </div>
</header>

<main class="wrap">
  <h2 class="section-title">Pick a game</h2>
  <nav class="menu">
    <a class="card card-link tint-1" href="tables.html">
      <span class="card-icon" aria-hidden="true">✖️</span>
      <span class="card-body">
        <span class="card-title">Multiplication Tables</span>
        <span class="card-text">Choose your tables from 1 to 30, fill in the boxes, and see how many stars you win!</span>
      </span>
      <span class="card-arrow" aria-hidden="true">▶</span>
    </a>

    <div class="card card-soon tint-2" aria-disabled="true">
      <span class="card-icon" aria-hidden="true">➕</span>
      <span class="card-body">
        <span class="card-title">Adding &amp; Taking Away</span>
        <span class="card-text">Coming soon… 🚧</span>
      </span>
    </div>

    <div class="card card-soon tint-3" aria-disabled="true">
      <span class="card-icon" aria-hidden="true">➗</span>
      <span class="card-body">
        <span class="card-title">Sharing &amp; Dividing</span>
        <span class="card-text">Coming soon… 🚧</span>
      </span>
    </div>
  </nav>
</main>

<footer class="wrap site-footer">
  <p>Made for happy practice 🌈</p>
</footer>
</body>
</html>
